
server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safezone}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}          # не короче 32 символов
    access-ttl-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health            # наружу отдаём только health
  endpoint:
    health:
      probes:
        enabled: true              # включает /actuator/health/readiness
