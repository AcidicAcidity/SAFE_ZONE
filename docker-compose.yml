name: Safe_Zone

services:
  db:
    image: postgresql:18.6
    restart: unless-stopped

    environment:
      DB_NAME: ${DB_NAME:?DB_NAME is required in .env}
      DB_USER: ${DB_USER:?DB_USER is required in .env}
      DB_PSSWD: ${DB_PSSWD:?DB_PSSWD is required in .env}
    volumes:
      - safe_zone:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD_SHELL",
          "pg_isready -U $$DB_USER -d $$DB_NAME"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

